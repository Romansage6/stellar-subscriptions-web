name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Fails on high or critical advisories in production dependencies.
      # How to handle a failure: docs/dependency-audit.md
      - name: npm audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high
